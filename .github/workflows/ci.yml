name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: read  # gitleaks-action lists the PR's commits to scan them
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: polyquant
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: polyquant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polyquant" --health-interval 5s --health-retries 10
    env:
      POLYQUANT_TEST_DATABASE_URL: postgresql://polyquant:ci-only@127.0.0.1:5432/polyquant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: pip-audit --skip-editable
